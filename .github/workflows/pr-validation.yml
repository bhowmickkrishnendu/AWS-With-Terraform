name: PR checks

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download and verify actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" \
            | sha256sum -c
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  terraform:
    name: Terraform format, validate, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.2
          terraform_wrapper: false
      - name: Check format
        run: terraform fmt -check -recursive bootstrap stacks modules examples
      - name: Initialize and validate every root
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap stacks/*; do
            echo "::group::${root}"
            terraform -chdir="$root" init -backend=false -lockfile=readonly -input=false
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done
      - name: Test IAM module wiring
        run: terraform -chdir=stacks/iam test -no-color
      - name: Test saved destroy plan on a disposable local stack
        run: python .github/tests/test_destroy_plan.py

  lint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - name: Lint every root
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap stacks/*; do
            echo "::group::${root}"
            (cd "$root" && tflint --init && tflint --format compact)
            echo "::endgroup::"
          done

  security:
    name: tfsec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Scan bootstrap
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: bootstrap
          version: v1.28.14
          additional_args: --minimum-severity HIGH
          soft_fail: false
      - name: Scan active stacks
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: stacks
          version: v1.28.14
          additional_args: --minimum-severity HIGH
          soft_fail: false

  cost:
    name: Infracost
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Require pricing API key
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -z "$INFRACOST_API_KEY" ]; then
            echo "::error::INFRACOST_API_KEY is required for the PR cost check."
            exit 1
          fi
      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: 0.10.45
      - name: Estimate deployed stacks
        shell: bash
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          set -euo pipefail
          for root in stacks/networking stacks/storage stacks/compute; do
            echo "::group::${root}"
            echo "### Cost estimate: ${root}" >> "$GITHUB_STEP_SUMMARY"
            infracost breakdown --path "$root" \
              --terraform-var-file terraform.tfvars \
              --format table | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done

  docs:
    name: Root and variable docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check root files and variable descriptions
        shell: bash
        run: |
          set -euo pipefail
          for root in bootstrap stacks/*; do
            for file in backend.tf provider.tf versions.tf .terraform.lock.hcl; do
              test -f "$root/$file" || { echo "::error::Missing $root/$file"; exit 1; }
            done
          done
          for root in stacks/*; do
            for file in main.tf variables.tf outputs.tf; do
              test -f "$root/$file" || { echo "::error::Missing $root/$file"; exit 1; }
            done
          done
          if rg -n 'description[[:space:]]*=[[:space:]]*""' stacks modules; then
            echo "::error::A variable or output has an empty description."
            exit 1
          fi
          test -f docs/pipeline.md
          test -f docs/recovery.md

  gate:
    name: PR checks
    if: always()
    needs: [workflow-lint, terraform, lint, security, cost, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
