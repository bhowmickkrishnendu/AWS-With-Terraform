name: Terraform Apply

on:
  push:
    branches:
      - main
      - master

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # ── Single source of truth for the component matrix ──────────────────────────
  matrix-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Define component matrix
        id: set-matrix
        run: |
          echo 'matrix={"include":[
            {"environment":"dev","component":"networking","aws_region":"ap-south-1"},
            {"environment":"dev","component":"compute","aws_region":"ap-south-1"}
          ]}' >> "$GITHUB_OUTPUT"
          # To add more components, append entries above, e.g.:
          # {"environment":"dev","component":"storage","aws_region":"ap-south-1"},
          # {"environment":"dev","component":"ecr","aws_region":"ap-south-1"},
          # {"environment":"dev","component":"eks","aws_region":"ap-south-1"}

  # ── Plan all components (uses matrix from matrix-config) ──────────────────────
  terraform-plan:
    needs: matrix-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-config.outputs.matrix) }}

    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-plan.yml@main

    with:
      environment: ${{ matrix.environment }}
      component: ${{ matrix.component }}
      aws_region: ${{ matrix.aws_region }}
      terraform_version: 1.14
      tfvars_file: ${{ matrix.environment }}.tfvars
      role_to_assume: arn:aws:iam::234617061868:role/github-actions-terraform-role

    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      # SYS_PUBKEY: ${{ secrets.SYS_PUBKEY }}

  # ── Manual approval gate ──────────────────────────────────────────────────────
  approval:
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approval gate
        run: echo "Deployment approved and proceeding to apply"

  # ── Apply all components (reuses the same matrix from matrix-config) ──────────
  terraform-apply:
    needs: [matrix-config, approval]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-config.outputs.matrix) }}

    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-apply.yml@main

    with:
      environment: ${{ matrix.environment }}
      component: ${{ matrix.component }}
      aws_region: ${{ matrix.aws_region }}
      terraform_version: 1.14
      role_to_assume: arn:aws:iam::234617061868:role/github-actions-terraform-role
    # secrets:
    #   SYS_PUBKEY: ${{ secrets.SYS_PUBKEY }}