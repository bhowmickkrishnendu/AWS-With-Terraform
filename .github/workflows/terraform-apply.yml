name: Terraform Deploy

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: terraform-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  networking_plan:
    name: Plan networking
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-plan.yml@0b19a6abb5594ae95992338c26762742df6b96ff
    with:
      environment: dev
      component: networking
      root_directory: stacks/networking
      aws_region: ap-south-1
      terraform_version: 1.14.2
      tfvars_file: terraform.tfvars
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}

  networking_apply:
    name: Apply networking
    needs: networking_plan
    if: needs.networking_plan.outputs.has_changes == 'true'
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-apply.yml@0b19a6abb5594ae95992338c26762742df6b96ff
    with:
      environment: dev
      component: networking
      root_directory: stacks/networking
      aws_region: ap-south-1
      terraform_version: 1.14.2
      approval_environment: apply-networking
      expected_plan_sha256: ${{ needs.networking_plan.outputs.plan_sha256 }}
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}

  storage_plan:
    name: Plan storage
    needs: [networking_plan, networking_apply]
    if: ${{ always() && needs.networking_plan.result == 'success' && (needs.networking_apply.result == 'success' || needs.networking_apply.result == 'skipped') }}
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-plan.yml@0b19a6abb5594ae95992338c26762742df6b96ff
    with:
      environment: dev
      component: storage
      root_directory: stacks/storage
      aws_region: ap-south-1
      terraform_version: 1.14.2
      tfvars_file: terraform.tfvars
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}

  storage_apply:
    name: Apply storage
    needs: storage_plan
    if: needs.storage_plan.outputs.has_changes == 'true'
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-apply.yml@0b19a6abb5594ae95992338c26762742df6b96ff
    with:
      environment: dev
      component: storage
      root_directory: stacks/storage
      aws_region: ap-south-1
      terraform_version: 1.14.2
      approval_environment: apply-storage
      expected_plan_sha256: ${{ needs.storage_plan.outputs.plan_sha256 }}
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}

  compute_plan:
    name: Plan compute
    needs: [storage_plan, storage_apply]
    if: ${{ always() && needs.storage_plan.result == 'success' && (needs.storage_apply.result == 'success' || needs.storage_apply.result == 'skipped') }}
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-plan.yml@0b19a6abb5594ae95992338c26762742df6b96ff
    with:
      environment: dev
      component: compute
      root_directory: stacks/compute
      aws_region: ap-south-1
      terraform_version: 1.14.2
      tfvars_file: terraform.tfvars
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}

  compute_apply:
    name: Apply compute
    needs: compute_plan
    if: needs.compute_plan.outputs.has_changes == 'true'
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-apply.yml@0b19a6abb5594ae95992338c26762742df6b96ff
    with:
      environment: dev
      component: compute
      root_directory: stacks/compute
      aws_region: ap-south-1
      terraform_version: 1.14.2
      approval_environment: apply-compute
      expected_plan_sha256: ${{ needs.compute_plan.outputs.plan_sha256 }}
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
