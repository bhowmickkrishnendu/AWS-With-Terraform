name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          # - uat
          # - prod

      component:
        description: "Component"
        required: true
        type: choice
        options:
          - networking
          - compute
          - storage
          - ecr
          - eks

      confirm_destroy:
        description: "Type DESTROY to continue"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-destroy.yml@5c384e29866d4f2d647536b86e64ea2b17dfb018

    with:
      environment: ${{ github.event.inputs.environment }}
      component: ${{ github.event.inputs.component }}
      aws_region: ap-south-1
      tfvars_file: ${{ github.event.inputs.environment }}.tfvars
      confirm_destroy: ${{ github.event.inputs.confirm_destroy }}
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
    # secrets:
    #   SYS_PUBKEY: ${{ secrets.SYS_PUBKEY }}
