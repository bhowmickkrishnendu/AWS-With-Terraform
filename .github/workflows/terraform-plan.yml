name: Terraform Manual Plan

on:
  workflow_dispatch:
    inputs:
      component:
        description: Deployed stack to plan
        required: true
        type: choice
        options:
          - networking
          - storage
          - compute

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-live-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    name: Manual plan
    if: github.ref == 'refs/heads/master'
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-plan.yml@46193a8e86a1cb015b8cd9576f12bedb222ce9bf # v3.0.0
    with:
      environment: dev
      component: ${{ inputs.component }}
      root_directory: stacks/${{ inputs.component }}
      aws_region: ap-south-1
      terraform_version: 1.14.2
      tfvars_file: terraform.tfvars
      upload_plan: false
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
