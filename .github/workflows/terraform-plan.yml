name: Terraform Manual Plan

on:
  workflow_dispatch:
    inputs:
      component:
        description: Deployed stack to plan
        required: true
        type: choice
        options:
          - networking
          - storage
          - compute

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Manual plan
    uses: bhowmickkrishnendu/terraform-gha-workflows/.github/workflows/terraform-plan.yml@v2.0.1
    with:
      environment: dev
      component: ${{ inputs.component }}
      root_directory: stacks/${{ inputs.component }}
      aws_region: ap-south-1
      terraform_version: 1.14.2
      tfvars_file: terraform.tfvars
      upload_plan: false
      role_to_assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
